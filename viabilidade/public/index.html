<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viabilidade · ImovelUm 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">IM</span>
      <div>
        <h1>Viabilidade <span id="anoTitulo">2026</span></h1>
        <small>ImovelUm · plano de viabilidade oficial</small>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </header>

  <nav class="weeknav">
    <div class="viewmodes" id="tabs">
      <button data-tab="dashboard" class="active">📊 Resumo</button>
      <button data-tab="orcado">💰 Orçado</button>
      <button data-tab="folha">👥 Folha</button>
      <button data-tab="previsao">📈 Previsibilidade</button>
      <button data-tab="cenarios">🎯 Cenários</button>
    </div>
    <select id="anoSel" title="Ano"></select>
    <div class="spacer"></div>
    <button id="btnAdd" class="primary"></button>
  </nav>

  <main id="view" class="grid"></main>

  <footer class="foot">
    <span id="status"></span>
  </footer>

  <div id="modal" class="modal hidden">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
