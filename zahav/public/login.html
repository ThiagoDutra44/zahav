<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZAHAV · Entrar</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <style>
    :root{ --bg:#0A0F1E; --gold:#D4AF37; --ink:#cdd9ff; --ink-dim:#7e8bb5; --panel:#0e1426; --line:#1b2540; --accent:#3b6fe0; }
    *{box-sizing:border-box} body{margin:0;height:100vh;background:var(--bg);color:var(--ink);
      font-family:"Segoe UI",Arial,system-ui,sans-serif;display:grid;place-items:center}
    .card{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:30px;width:min(380px,92vw);text-align:center}
    .pep{height:70px;mix-blend-mode:lighten;filter:drop-shadow(0 0 8px rgba(212,175,55,.5))}
    h1{margin:8px 0 0;letter-spacing:5px;color:var(--gold)}
    .by{color:var(--ink-dim);font-size:11px;margin-bottom:20px}
    label{display:block;text-align:left;font-size:12px;color:var(--ink-dim);margin:12px 0 4px}
    input{width:100%;background:#0b1124;border:1px solid var(--line);color:var(--ink);padding:11px;border-radius:9px;font-size:15px}
    #codigo{letter-spacing:6px;text-align:center;font-size:20px}
    button{margin-top:20px;width:100%;background:var(--gold);border:none;color:#1a1300;padding:12px;border-radius:9px;font-weight:800;font-size:15px;cursor:pointer}
    button:hover{filter:brightness(1.08)}
    .erro{color:#f87171;font-size:13px;margin-top:12px;min-height:18px}
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" class="pep" alt="ZAHAV" />
    <h1>ZAHAV</h1>
    <div class="by">by ImovelUm</div>
    <form onsubmit="entrar(event)">
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="current-password" autofocus />
      <label>Código 2FA (6 dígitos)</label>
      <input id="codigo" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" />
      <button type="submit">Entrar</button>
      <div class="erro" id="err"></div>
    </form>
  </div>
  <script>
    async function entrar(e) {
      e.preventDefault();
      const err = document.getElementById('err'); err.textContent = '';
      const senha = document.getElementById('senha').value, codigo = document.getElementById('codigo').value;
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha, codigo }) }).then((x) => x.json());
      if (r.ok) { location.href = '/'; } else { err.textContent = r.erro || 'Falha no login.'; }
    }
  </script>
</body>
</html>
