<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendas · ImovelUm 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">IM</span>
      <div>
        <h1><span id="tituloSeg">Vendas</span> <span id="anoTitulo">2026</span></h1>
        <small>ImovelUm · migrado de VENDAS 2026.xlsm</small>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </header>

  <nav class="weeknav">
    <div class="segsw" id="segsw">
      <button data-seg="venda" class="active">🏷️ Vendas</button>
      <button data-seg="locacao">🔑 Locações</button>
    </div>
    <div class="viewmodes" id="tabs">
      <button data-tab="funil" class="active">📋 Funil</button>
      <button data-tab="dashboard">📊 Dashboard</button>
      <button data-tab="ranking">🏆 Ranking</button>
      <button data-tab="recebiveis">💰 Recebíveis</button>
    </div>
    <select id="anoSel" title="Ano"></select>
    <div class="spacer"></div>
    <div id="fatAno" class="fatano" title="Faturamento real do ano — tudo que já foi faturado (vendas + locações + receita marginal, todos os segmentos assinados)"></div>
    <button id="btnAdd" class="primary">+ Nova venda</button>
    <button id="btnPriv" class="ghost" title="Modo privacidade: escurece a tela e revela só onde o mouse está (quem está ao lado não lê)">🕶️</button>
  </nav>

  <div id="privacyFilm" aria-hidden="true"></div>
  <main id="view" class="grid"></main>

  <footer class="foot">
    <button id="btnCadastros" class="ghost">👥 Cadastros</button>
    <button id="btnMetas" class="ghost">🎯 Metas</button>
    <button id="btnDesist" class="ghost">🚫 Desistências</button>
    <button id="btnPonte" class="ghost">🔗 Fluxo de Caixa</button>
    <span id="status"></span>
  </footer>

  <button id="fabAdd" class="fab" title="Nova venda">+</button>

  <div id="modal" class="modal hidden">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
